<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Admin Dashboard - EduRank</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-section {
        padding-top: 40px;
        min-height: 90vh;
    }
    .admin-container {
        max-width: 1200px;
        margin: 0 auto;
        background: var(--surface-glass);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 30px;
        border: 1px solid var(--border);
    }
    .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 20px;
    }
    .admin-header h1 {
        font-size: 1.8rem;
        background: var(--gradient-main);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .stats-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }
    .stat-box {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 20px;
        text-align: center;
    }
    .stat-box h3 {
        font-size: 2rem;
        color: var(--primary);
        font-weight: 700;
        margin-bottom: 5px;
    }
    .stat-box p {
        font-size: 0.85rem;
        color: var(--text-light);
    }
    .player-card-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
    }
    .player-card {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 24px;
        display: grid;
        grid-template-columns: 1.2fr 2fr 1.2fr;
        gap: 24px;
        align-items: start;
        transition: 0.3s;
    }
    .player-card:hover {
        border-color: rgba(127,119,221,0.4);
        background: rgba(255,255,255,0.04);
    }
    .player-card.banned {
        border-left: 5px solid #dc2626;
        opacity: 0.85;
    }
    .player-card.active {
        border-left: 5px solid #10b981;
    }
    .player-identity {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .player-identity h2 {
        font-size: 1.2rem;
        color: var(--text);
        margin: 0;
    }
    .player-identity p {
        font-size: 0.85rem;
        color: var(--text-light);
        word-break: break-all;
    }
    .badge-status {
        display: inline-block;
        width: fit-content;
        padding: 4px 10px;
        border-radius: 99px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
    }
    .badge-status.active-badge {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-status.banned-badge {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .player-photos {
        display: flex;
        gap: 12px;
        margin-top: 10px;
    }
    .photo-preview {
        flex: 1;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border);
        cursor: pointer;
        position: relative;
        height: 100px;
        background: rgba(0,0,0,0.3);
    }
    .photo-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .photo-preview span {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0,0,0,0.7);
        color: white;
        font-size: 0.7rem;
        text-align: center;
        padding: 4px 0;
        font-weight: 500;
    }
    .player-editor-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    .editor-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .editor-group label {
        font-size: 0.75rem;
        color: var(--text-light);
        font-weight: 500;
    }
    .editor-group input {
        background: rgba(0,0,0,0.25);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-family: inherit;
        transition: 0.3s;
    }
    .editor-group input:focus {
        border-color: var(--primary);
        background: rgba(0,0,0,0.4);
    }
    .player-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        justify-content: center;
        height: 100%;
    }
    .btn-action {
        width: 100%;
        padding: 10px 16px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        transition: 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: white;
    }
    .btn-save {
        background: var(--primary);
    }
    .btn-save:hover {
        background: var(--primary-hover);
    }
    .btn-ban {
        background: rgba(245, 158, 11, 0.15);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #fbbf24;
    }
    .btn-ban:hover {
        background: #f59e0b;
        color: white;
    }
    .btn-unban {
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.3);
        color: #34d399;
    }
    .btn-unban:hover {
        background: #10b981;
        color: white;
    }
    .btn-delete {
        background: rgba(220, 38, 38, 0.15);
        border: 1px solid rgba(220, 38, 38, 0.3);
        color: #f87171;
    }
    .btn-delete:hover {
        background: #dc2626;
        color: white;
    }
    
    /* Lightbox Modal */
    .lightbox {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(15, 23, 42, 0.95);
        z-index: 1000000;
        display: none;
        align-items: center;
        justify-content: center;
        cursor: zoom-out;
    }
    .lightbox.show {
        display: flex;
    }
    .lightbox img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        border: 2px solid var(--border);
    }
    
    @media(max-width: 992px) {
        .player-card {
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .player-actions {
            flex-direction: row;
        }
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="navbar container">
      <a href="index.html?view=main#home" class="nav-logo" style="text-decoration:none;">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>EduRank Admin</span>
      </a>
      <div class="nav-menu" id="navMenu">
        <a href="index.html?view=main#home" class="nav-link">Home</a>
        <a href="leaderboard.html" class="nav-link">Leaderboard</a>
        <a href="admin.html" class="nav-link active-link">Admin Dashboard</a>
      </div>
      <div class="nav-actions">
        <button class="nav-icon-btn" id="darkModeBtn" onclick="toggleDarkMode()">
          <i class="fa-solid fa-moon" id="darkModeIcon"></i>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <section class="admin-section">
      <div class="admin-container">
        <div class="admin-header">
          <h1><i class="fa-solid fa-users-cog"></i> Player Registrations & Ban Manager</h1>
          <button class="secondary-btn" onclick="fetchPlayers()" style="padding: 10px 20px; border-radius: 10px;"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </div>

        <div class="stats-bar">
          <div class="stat-box">
            <h3 id="statTotal">0</h3>
            <p>Total Pendaftar</p>
          </div>
          <div class="stat-box">
            <h3 id="statUnverified" style="color: #fbbf24;">0</h3>
            <p>Belum Diverifikasi (-)</p>
          </div>
          <div class="stat-box">
            <h3 id="statBanned" style="color: #ef4444;">0</h3>
            <p>Akun Diblokir</p>
          </div>
        </div>

        <div class="player-card-grid" id="playersList">
          <div style="text-align: center; padding: 40px; color: var(--text-light);">Loading players...</div>
        </div>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img src="" id="lightboxImg" alt="Lightbox Preview">
  </div>

  <footer class="footer">
    <div class="container footer-content">
      <div class="footer-logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>EduRank</span>
      </div>
      <p>© 2026 EduRank. Developer Administrative Services.</p>
    </div>
  </footer>

  <script src="api-config.js"></script>
  <script>
    // Initialize dark theme
    document.documentElement.classList.add(localStorage.getItem("theme") === "light" ? "light" : "dark");
    document.body.classList.add(localStorage.getItem("theme") === "light" ? "light" : "dark");

    function toggleDarkMode() {
        const isLight = document.body.classList.contains("light");
        const nextTheme = isLight ? "dark" : "light";
        localStorage.setItem("theme", nextTheme);
        document.documentElement.classList.remove("light", "dark");
        document.body.classList.remove("light", "dark");
        document.documentElement.classList.add(nextTheme);
        document.body.classList.add(nextTheme);
        const icon = document.getElementById("darkModeIcon");
        if (icon) {
            icon.className = nextTheme === "light" ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }
    }

    function getAdminAuthHeaders(extraHeaders = {}) {
        const token = localStorage.getItem("edurank_token");
        if (!token) {
            throw new Error("Sesi login admin tidak ditemukan. Silakan login kembali.");
        }
        return {
            ...extraHeaders,
            "Authorization": "Bearer " + token
        };
    }

    function handleAdminAuthFailure(res) {
        if (res && (res.status === 401 || res.status === 403)) {
            localStorage.removeItem("edurank_token");
            alert("Akses admin ditolak. Silakan login ulang dengan akun admin.");
            window.location.href = "index.html";
            return true;
        }
        return false;
    }

    async function fetchPlayers() {
        const container = document.getElementById("playersList");
        container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-light);"><i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem;"></i><br/><br/>Memuat data pemain...</div>`;
        
        try {
            const res = await fetch(getApiUrl('/api/admin/users'), {
                headers: getAdminAuthHeaders()
            });
            if (handleAdminAuthFailure(res)) return;
            if (!res.ok) throw new Error("API call failed");
            const players = await res.json();
            
            renderPlayers(players);
        } catch(e) {
            console.error(e);
            container.innerHTML = `<div style="text-align: center; padding: 40px; color: #ef4444;"><i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; margin-bottom: 10px;"></i><br/>Gagal memuat data pemain dari server. Hubungi backend.</div>`;
        }
    }

    function renderPlayers(players) {
        const container = document.getElementById("playersList");
        container.innerHTML = "";

        let total = players.length;
        let unverified = 0;
        let banned = 0;

        players.forEach(p => {
            if (p.banned) banned++;
            if (p.username === '-' || p.province === '-' || p.city === '-') unverified++;

            const card = document.createElement("div");
            card.className = `player-card ${p.banned ? 'banned' : 'active'}`;
            
            // Resolve local host paths for images
            const studentPhoto = p.student_photo && p.student_photo !== '-' ? getApiUrl(p.student_photo) : null;
            const studentCardPhoto = p.student_card_photo && p.student_card_photo !== '-' ? getApiUrl(p.student_card_photo) : null;

            card.innerHTML = `
                <div class="player-identity">
                    <h2>${escapeHtml(p.name)}</h2>
                    <p style="font-weight: 600; color: var(--primary);">@${escapeHtml(p.username)}</p>
                    <p><i class="fa-solid fa-envelope"></i> ${escapeHtml(p.email)}</p>
                    <p><i class="fa-solid fa-cake-candles"></i> Lahir: ${escapeHtml(p.birth_date)}</p>
                    <span class="badge-status ${p.banned ? 'banned-badge' : 'active-badge'}">${p.banned ? 'Banned' : 'Active'}</span>
                    
                    <div class="player-photos">
                        ${studentPhoto ? `
                            <div class="photo-preview" onclick="openLightbox('${studentPhoto}')">
                                <img src="${studentPhoto}" alt="Foto Pelajar">
                                <span>Foto Pelajar</span>
                            </div>
                        ` : '<div class="photo-preview" style="display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:var(--text-light);">No Photo</div>'}
                        
                        ${studentCardPhoto ? `
                            <div class="photo-preview" onclick="openLightbox('${studentCardPhoto}')">
                                <img src="${studentCardPhoto}" alt="Wajah Kartu">
                                <span>Wajah & Kartu</span>
                            </div>
                        ` : '<div class="photo-preview" style="display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:var(--text-light);">No Card</div>'}
                    </div>
                </div>

                <div class="player-editor-form">
                    <div class="editor-group">
                        <label>Username / Nickname</label>
                        <input type="text" id="username_${p.id}" value="${escapeHtml(p.username)}">
                    </div>
                    <div class="editor-group">
                        <label>Kelas</label>
                        <input type="text" id="class_${p.id}" value="${escapeHtml(p.class_level)}">
                    </div>
                    <div class="editor-group">
                        <label>Sekolah</label>
                        <input type="text" id="school_${p.id}" value="${escapeHtml(p.school)}">
                    </div>
                    <div class="editor-group">
                        <label>Provinsi</label>
                        <input type="text" id="province_${p.id}" value="${escapeHtml(p.province)}">
                    </div>
                    <div class="editor-group" style="grid-column: span 2;">
                        <label>Kabupaten / Kota</label>
                        <input type="text" id="city_${p.id}" value="${escapeHtml(p.city)}">
                    </div>
                </div>

                <div class="player-actions">
                    <button class="btn-action btn-save" onclick="saveDetails(${p.id})">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan Detail
                    </button>
                    <button class="btn-action ${p.banned ? 'btn-unban' : 'btn-ban'}" onclick="toggleBan(${p.id}, ${p.banned ? 0 : 1})">
                        <i class="fa-solid ${p.banned ? 'fa-user-check' : 'fa-user-slash'}"></i> ${p.banned ? 'Bebaskan Ban' : 'Blokir / Ban'}
                    </button>
                    <button class="btn-action btn-delete" onclick="deleteAccount(${p.id})">
                        <i class="fa-solid fa-trash-can"></i> Hapus Akun
                    </button>
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById("statTotal").innerText = total;
        document.getElementById("statUnverified").innerText = unverified;
        document.getElementById("statBanned").innerText = banned;

        if (total === 0) {
            container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-light);">Belum ada pendaftar akun.</div>`;
        }
    }

    async function saveDetails(id) {
        const username = document.getElementById(`username_${id}`).value;
        const province = document.getElementById(`province_${id}`).value;
        const city = document.getElementById(`city_${id}`).value;
        const school = document.getElementById(`school_${id}`).value;
        const class_level = document.getElementById(`class_${id}`).value;

        try {
            const res = await fetch(getApiUrl('/api/admin/update-profile'), {
                method: "POST",
                headers: getAdminAuthHeaders({ "Content-Type": "application/json" }),
                body: JSON.stringify({ id, username, province, city, school, class_level })
            });
            if (handleAdminAuthFailure(res)) return;
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Gagal update detail");
            
            showToast("Detail player berhasil disimpan!", "success");
            fetchPlayers();
        } catch(e) {
            alert(e.message || "Gagal menyimpan detail");
        }
    }

    async function toggleBan(id, bannedState) {
        if (!confirm(bannedState ? "Apakah Anda yakin ingin memblokir/ban akun ini?" : "Apakah Anda yakin ingin melepas ban akun ini?")) return;

        try {
            const res = await fetch(getApiUrl('/api/admin/ban'), {
                method: "POST",
                headers: getAdminAuthHeaders({ "Content-Type": "application/json" }),
                body: JSON.stringify({ id, banned: bannedState })
            });
            if (handleAdminAuthFailure(res)) return;
            if (!res.ok) throw new Error("Gagal merubah status ban");
            
            showToast(bannedState ? "Akun berhasil dibanned!" : "Akun berhasil diaktifkan kembali!", "success");
            fetchPlayers();
        } catch(e) {
            alert(e.message || "Gagal merubah status ban");
        }
    }

    async function deleteAccount(id) {
        if (!confirm("PERINGATAN: Menghapus akun akan membuang player ini secara permanen dari database. Tindakan ini tidak bisa dibatalkan! Lanjutkan?")) return;

        try {
            const res = await fetch(getApiUrl(`/api/admin/users/${id}`), {
                method: "DELETE",
                headers: getAdminAuthHeaders()
            });
            if (handleAdminAuthFailure(res)) return;
            if (!res.ok) throw new Error("Gagal menghapus akun");
            
            showToast("Akun player telah dihapus secara permanen!", "success");
            fetchPlayers();
        } catch(e) {
            alert(e.message || "Gagal menghapus akun");
        }
    }

    // Lightbox handlers
    function openLightbox(url) {
        const lightbox = document.getElementById("lightbox");
        const img = document.getElementById("lightboxImg");
        img.src = url;
        lightbox.classList.add("show");
    }

    function closeLightbox() {
        document.getElementById("lightbox").classList.remove("show");
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>'"]/g, (character) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        })[character]);
    }

    function showToast(msg, type = "success") {
        const toast = document.createElement("div");
        toast.style = `
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            z-index: 1100000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background: ${type === 'success' ? 'var(--success)' : 'rgba(220,38,38,0.9)'};
            transition: 0.3s ease;
            transform: translateY(100px);
            opacity: 0;
            font-family: 'Poppins', sans-serif;
        `;
        toast.innerText = msg;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.style.transform = 'translateY(0)';
            toast.style.opacity = '1';
        }, 50);

        setTimeout(() => {
            toast.style.transform = 'translateY(100px)';
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // Load initial list
    document.addEventListener("DOMContentLoaded", fetchPlayers);
  </script>
</body>
</html>
